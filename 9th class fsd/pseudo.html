<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pseudo HTML Layout</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <div class="container">
    <div class="box1">
      <h3>Box1 Heading</h3>
      <p>Box1 Paragraph One</p>
      <p>Box1 Paragraph Two</p>
      <p>Box1 Paragraph Three</p>
      <p>Box1 Paragraph Four</p>
    </div>

    <p>Container Paragraph One</p>
    <p>Container Paragraph Two</p>

    <div class="box2">
      <p>Box2 Paragraph One</p>
      <p>Box2 Paragraph Two</p>
      <p>Box2 Paragraph Three</p>
    </div>
  </div>
</body>
</html>
