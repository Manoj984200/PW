            gap: 2px;
            grid-template-rows: 100px 100px 100px;
        }
        .box{

            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

        <div class="box">BOX1</div>

        <div class="box">BOX1</div>
        <div class="box">BOX1</div>
        <div class="box">BOX1</div>
        <div class="box">BOX1</div>
        <div class="box">BOX1</div>
        <div class="box">BOX1</div>
    </div>
    
</body>
</html>
