<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marksheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h2 {
            text-align: center;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
            width: 70%;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tfoot td {
            font-weight: bold;
            background-color: #ddd;
        }
    </style>
</head>
<body>

<h2>Student Marksheet</h2>

<table>
    <thead>
        <tr>
            <th>Subject</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>88</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
        </tr>
        <tr>
            <td>English</td>
            <td>100</td>
            <td>75</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>80</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Hindi</td>
            <td>100</td>
            <td>78</td>
            <td>B+</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td>Total</td>
            <td>500</td>
            <td>403</td>
            <td>-</td>
        </tr>
        <tr>
            <td>Percentage</td>
            <td colspan="3">80.6%</td>
        </tr>
    </tfoot>
</table>
<script src="style1.js"></script>
<script src="innertext.js"></script>
<script src="selectors.js"></script>
</body>
</html>
